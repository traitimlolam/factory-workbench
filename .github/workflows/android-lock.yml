name: Khóa APK mẫu
run-name: build-${{ inputs.order_code }}

on:
  workflow_dispatch:
    inputs:
      order_code:
        required: true
        type: string
      kind:
        required: true
        type: choice
        options: [trial, paid]
      model:
        required: true
        type: string
      sdk:
        required: true
        type: string
      license_id:
        required: true
        type: string
      trial_seconds:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Cài công cụ Android
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apktool
      - name: Build app mẫu
        run: gradle --no-daemon -p android-sample :app:assembleDebug
      - name: Cá nhân hóa và ký APK
        env:
          LOCK_KIND: ${{ inputs.kind }}
          LOCK_MODEL: ${{ inputs.model }}
          LOCK_SDK: ${{ inputs.sdk }}
          LOCK_LICENSE_ID: ${{ inputs.license_id }}
          LOCK_TRIAL_SECONDS: ${{ inputs.trial_seconds }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          APK_KS_PASS: ${{ secrets.KS_PASS }}
          APK_KEY_PASS: ${{ secrets.KS_PASS }}
          APK_KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          export APK_KEYSTORE="$RUNNER_TEMP/factory.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$APK_KEYSTORE"
          mkdir -p build_out
          python3 tools/lock_apk.py --source android-sample/app/build/outputs/apk/debug/app-debug.apk --out build_out/app.apk
          sha256sum build_out/app.apk | awk '{print $1}' > build_out/app.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build_out/app.apk
            build_out/app.apk.sha256
          if-no-files-found: error
          retention-days: 1
